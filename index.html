<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR Website</title>

  <!-- A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>

  <!-- AR.js for A-Frame -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

 

  <style>
    body { margin: 0; overflow: hidden; }
    .arjs-loader {
      height: 100%; width: 100%;
      position: fixed; top: 0; left: 0;
      background: black;
      z-index: 9999; display: flex;
      justify-content: center; align-items: center;
    }
    .arjs-loader div {
      color: white; font-family: sans-serif;
      font-size: 1.2em; text-align: center;
    }
  </style>
</head>


<body style="margin: 0; overflow: hidden;">

  <div class="arjs-loader">
    <div>Loading AR experience...</div>
  </div>

  <canvas id="outputCanvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 5;"></canvas>

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="logarithmicDepthBuffer: true; preserveDrawingBuffer: true;"
  >
    <!-- Marker: default "Hiro" pattern marker -->
    <a-marker preset="hiro">
      <a-entity
        gltf-model="model.glb"
        position="0 0 0"
        scale="0.05 0.05 0.05"
        rotation="0 0 0"
      ></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Hide loader once the scene is ready
    document.querySelector('a-scene').addEventListener('loaded', function () {
      document.querySelector('.arjs-loader').style.display = 'none';
    });

    // Continuously draw the camera video + WebGL scene onto a single canvas
    const outputCanvas = document.getElementById('outputCanvas');
    const ctx = outputCanvas.getContext('2d');

    function renderLoop() {
      const video = document.querySelector('video');       // AR.js camera feed
      const glCanvas = document.querySelector('a-scene').canvas; // A-Frame's WebGL canvas

      if (video && video.readyState >= 2) { // video has data
        if (outputCanvas.width !== glCanvas.width || outputCanvas.height !== glCanvas.height) {
          outputCanvas.width = glCanvas.width;
          outputCanvas.height = glCanvas.height;
        }
    
        // 1. Camera feed (bottom layer)
        ctx.drawImage(video, 0, 0, outputCanvas.width, outputCanvas.height);

        // 2. 3D model on top (transparent bg lets video show through)
        ctx.drawImage(glCanvas, 0, 0, outputCanvas.width, outputCanvas.height);

        // 3. Apply your effects here, e.g.:
        // ctx.filter = 'grayscale(100%)';
        // or manipulate pixels directly:
        // const frame = ctx.getImageData(0, 0, outputCanvas.width, outputCanvas.height);
        // ... modify frame.data ...
        // ctx.putImageData(frame, 0, 0);
        // wherever your AR frame is drawn to your existing canvas/context, add this one line after it:
        
      }

      requestAnimationFrame(renderLoop);
    }

    renderLoop();
  </script>

</body>
</html>
