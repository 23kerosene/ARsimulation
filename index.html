<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR Website</title>

  <!-- A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>

  <!-- AR.js for A-Frame -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <!--glitch Effect-->
  <script>
function glitchEffect(ctx, canvas, intensity = 0.4) {
  const w = canvas.width, h = canvas.height;
  const amt = Math.max(0, Math.min(1, intensity));
  if (amt <= 0) return;

  const frame = ctx.getImageData(0, 0, w, h);
  const data = frame.data;
  const shift = Math.round(amt * 12);
  if (shift > 0) {
    const copy = new Uint8ClampedArray(data);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const idx = (y * w + x) * 4;
        const rx = Math.min(w - 1, x + shift);
        const bx = Math.max(0, x - shift);
        data[idx]     = copy[(y * w + rx) * 4];
        data[idx + 2] = copy[(y * w + bx) * 4 + 2];
      }
    }
  }
  ctx.putImageData(frame, 0, 0);

  const sliceCount = Math.round(amt * 8);
  for (let i = 0; i < sliceCount; i++) {
    if (Math.random() > 0.5) continue;
    const sy = Math.floor(Math.random() * h);
    const sh = Math.max(2, Math.floor(Math.random() * h * 0.08));
    const dx = Math.floor((Math.random() - 0.5) * amt * 60);
    ctx.drawImage(canvas, 0, sy, w, sh, dx, sy, w, sh);
  }

  ctx.globalAlpha = 0.15 * amt;
  ctx.fillStyle = '#000';
  for (let y = 0; y < h; y += 3) ctx.fillRect(0, y, w, 1);
  ctx.globalAlpha = 1;

  if (Math.random() < amt * 0.15) {
    const nd = ctx.getImageData(0, 0, w, h);
    const nData = nd.data;
    for (let i = 0; i < nData.length; i += 4) {
      if (Math.random() < 0.02) {
        const v = Math.random() * 255;
        nData[i] = v; nData[i + 1] = v; nData[i + 2] = v;
      }
    }
    ctx.putImageData(nd, 0, 0);
  }

  if (Math.random() < amt * 0.08) {
    ctx.globalAlpha = 0.1;
    ctx.fillStyle = Math.random() < 0.5 ? '#ff003c' : '#00e5ff';
    ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 1;
  }
}
</script>

  <style>
    body { margin: 0; overflow: hidden; }
    .arjs-loader {
      height: 100%; width: 100%;
      position: fixed; top: 0; left: 0;
      background: black;
      z-index: 9999; display: flex;
      justify-content: center; align-items: center;
    }
    .arjs-loader div {
      color: white; font-family: sans-serif;
      font-size: 1.2em; text-align: center;
    }
    #debugOverlay {
      position: fixed; bottom: 0; left: 0; right: 0;
      max-height: 30%; overflow-y: auto;
      background: rgba(0,0,0,0.75); color: #0f0;
      font: 11px monospace; padding: 6px;
      z-index: 10000; display: none; white-space: pre-wrap;
    }
  </style>
</head>


<body style="margin: 0; overflow: hidden;">

  <div class="arjs-loader">
    <div>Loading AR experience...</div>
  </div>

  <canvas id="outputCanvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 5;"></canvas>
  <div id="debugOverlay"></div>

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="logarithmicDepthBuffer: true; preserveDrawingBuffer: true; alpha: true;"
  >
    <!-- Marker: default "Hiro" pattern marker -->
    <a-marker preset="hiro">
      <a-entity
        id="model-on-marker"
        gltf-model="bodys_test.glb"
        position="0 0 0"
        scale="0.1 0.1 0.1"
        rotation="0 0 0"
      ></a-entity>
    </a-marker>

    <!-- TEMP DIAGNOSTIC: same model, always visible in front of the camera,
         with no marker required. If this shows up but the one on the marker
         doesn't, the model itself is fine and it's a marker-tracking problem.
         If this ALSO never appears, the model isn't loading. Remove this
         whole <a-entity> once you've confirmed which case you're in. -->
    <a-entity
      id="model-test-fixed"
      gltf-model="bodys_test.glb"
      position="0 0 -1"
      scale="0.1 0.1 0.1"
      rotation="0 0 0"
    ></a-entity>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Hide loader once the scene is ready
    document.querySelector('a-scene').addEventListener('loaded', function () {
      document.querySelector('.arjs-loader').style.display = 'none';
    });

    // TEMP DIAGNOSTIC: surface glTF load success/failure on screen.
    // Remove once the model is confirmed working.
    const debugOverlayEl = document.getElementById('debugOverlay');
    function showDebug(msg) {
      debugOverlayEl.style.display = 'block';
      debugOverlayEl.textContent += msg + '\n';
      console.log(msg);
    }
    ['model-on-marker', 'model-test-fixed'].forEach(function (id) {
      const el = document.getElementById(id);
      el.addEventListener('model-loaded', function (e) {
        showDebug('[' + id + '] model-loaded OK');

        // TEMP DIAGNOSTIC: measure the model's actual size/center so we know
        // whether the problem is scale, an off-center pivot, or something else.
        const obj = e.detail.model;
        const box = new THREE.Box3().setFromObject(obj);
        const size = new THREE.Vector3();
        const center = new THREE.Vector3();
        box.getSize(size);
        box.getCenter(center);
        showDebug('[' + id + '] raw size: ' +
          size.x.toFixed(3) + ' x ' + size.y.toFixed(3) + ' x ' + size.z.toFixed(3) +
          '  center offset: ' + center.x.toFixed(3) + ',' + center.y.toFixed(3) + ',' + center.z.toFixed(3));

        // Defensive fixes for two common "loaded but invisible" causes:
        // 1) exporters sometimes leave frustumCulled bounding spheres wrong, so
        //    a visible mesh gets culled as if it were off-screen.
        // 2) single-sided materials disappear when you're viewing the "inside".
        obj.traverse(function (node) {
          if (node.isMesh) {
            node.frustumCulled = false;
            if (node.material) node.material.side = THREE.DoubleSide;
          }
        });
      });
      el.addEventListener('model-error', function (e) {
        showDebug('[' + id + '] model-error: ' + (e.detail && e.detail.src) + ' - ' + (e.detail && e.detail.format));
      });
    });

    // Continuously draw the camera video + WebGL scene onto a single canvas
    const outputCanvas = document.getElementById('outputCanvas');
    const ctx = outputCanvas.getContext('2d');
    const debugOverlay = document.getElementById('debugOverlay');

    // Show ~last 5 errors on screen (not just console) so this is debuggable on a phone
    // where you may not have easy access to devtools. Remove this block once things work.
    let lastErrorMsg = '';
    let errorRepeatCount = 0;
    function reportError(err) {
      const msg = (err && err.message) ? err.message : String(err);
      if (msg === lastErrorMsg) {
        errorRepeatCount++;
      } else {
        lastErrorMsg = msg;
        errorRepeatCount = 1;
        console.error('renderLoop error:', err);
        debugOverlay.style.display = 'block';
        debugOverlay.textContent = 'renderLoop error: ' + msg;
      }
    }

    function renderLoop() {
      try {
        const video = document.querySelector('video');       // AR.js camera feed
        const sceneEl = document.querySelector('a-scene');
        const glCanvas = sceneEl && sceneEl.canvas;           // A-Frame's WebGL canvas

        const videoReady = video && video.readyState >= 2;
        const glReady = glCanvas && glCanvas.width > 0 && glCanvas.height > 0;

        if (videoReady && glReady) {
          if (outputCanvas.width !== glCanvas.width || outputCanvas.height !== glCanvas.height) {
            outputCanvas.width = glCanvas.width;
            outputCanvas.height = glCanvas.height;
          }

          // 1. Camera feed (bottom layer)
          ctx.drawImage(video, 0, 0, outputCanvas.width, outputCanvas.height);

          // 2. 3D model on top (transparent bg lets video show through)
          ctx.drawImage(glCanvas, 0, 0, outputCanvas.width, outputCanvas.height);

          // 3. Effects
          glitchEffect(ctx, outputCanvas, 0.45); // 3rd param = intensity, 0 to 1
        }
      } catch (err) {
        // IMPORTANT: this is almost certainly why the effect wasn't showing before.
        // Any error thrown in here used to silently stop requestAnimationFrame forever,
        // since the call to schedule the next frame lived after this code, unprotected.
        reportError(err);
      }

      // Always keep the loop alive, even if this frame errored.
      requestAnimationFrame(renderLoop);
    }

    renderLoop();
  </script>

</body>
</html>
