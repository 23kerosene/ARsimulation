<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR Website</title>

  <!-- A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>

  <!-- AR.js for A-Frame -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <script>
    // AR.js configures its own renderer internally for camera-based AR and does
    // not reliably pass through A-Frame's renderer="preserveDrawingBuffer: true"
    // attribute. Without preserveDrawingBuffer actually being true on the real
    // WebGL context, the browser is allowed to clear the drawing buffer the
    // moment a frame is presented - so by the time an independent script reads
    // the canvas via drawImage(), it can consistently capture an already-cleared
    // (transparent) buffer, even though A-Frame's own on-screen render looks
    // completely normal. This patches every WebGL context creation to force it.
    (function () {
      var origGetContext = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function (type, attribs) {
        if (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl') {
          attribs = attribs || {};
          attribs.preserveDrawingBuffer = true;
        }
        return origGetContext.call(this, type, attribs);
      };
    })();

    // Composite video + the rendered 3D scene immediately after A-Frame finishes
    // rendering each frame (the "tock" lifecycle method runs right after
    // sceneEl.renderer.render() for that frame), rather than on an independent
    // requestAnimationFrame loop whose timing relative to A-Frame's own render
    // isn't guaranteed.
    AFRAME.registerComponent('canvas-compositor', {
      init: function () {
        this.outputCanvas = document.getElementById('outputCanvas');
        this.outCtx = this.outputCanvas.getContext('2d');
      },
      tock: function () {
        if (typeof window.compositeFrame === 'function') {
          window.compositeFrame(this.el, this.outputCanvas, this.outCtx);
        }
      }
    });
  </script>

  <!--glitch Effect-->
  <script>
function glitchEffect(ctx, canvas, intensity = 0.4) {
  const w = canvas.width, h = canvas.height;
  const amt = Math.max(0, Math.min(1, intensity));
  if (amt <= 0) return;

  const frame = ctx.getImageData(0, 0, w, h);
  const data = frame.data;
  const shift = Math.round(amt * 12);
  if (shift > 0) {
    const copy = new Uint8ClampedArray(data);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const idx = (y * w + x) * 4;
        const rx = Math.min(w - 1, x + shift);
        const bx = Math.max(0, x - shift);
        data[idx]     = copy[(y * w + rx) * 4];
        data[idx + 2] = copy[(y * w + bx) * 4 + 2];
      }
    }
  }
  ctx.putImageData(frame, 0, 0);

  const sliceCount = Math.round(amt * 8);
  for (let i = 0; i < sliceCount; i++) {
    if (Math.random() > 0.5) continue;
    const sy = Math.floor(Math.random() * h);
    const sh = Math.max(2, Math.floor(Math.random() * h * 0.08));
    const dx = Math.floor((Math.random() - 0.5) * amt * 60);
    ctx.drawImage(canvas, 0, sy, w, sh, dx, sy, w, sh);
  }

  ctx.globalAlpha = 0.15 * amt;
  ctx.fillStyle = '#000';
  for (let y = 0; y < h; y += 3) ctx.fillRect(0, y, w, 1);
  ctx.globalAlpha = 1;

  if (Math.random() < amt * 0.15) {
    const nd = ctx.getImageData(0, 0, w, h);
    const nData = nd.data;
    for (let i = 0; i < nData.length; i += 4) {
      if (Math.random() < 0.02) {
        const v = Math.random() * 255;
        nData[i] = v; nData[i + 1] = v; nData[i + 2] = v;
      }
    }
    ctx.putImageData(nd, 0, 0);
  }

  if (Math.random() < amt * 0.08) {
    ctx.globalAlpha = 0.1;
    ctx.fillStyle = Math.random() < 0.5 ? '#ff003c' : '#00e5ff';
    ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 1;
  }
}
</script>

  <style>
    body { margin: 0; overflow: hidden; }
    .arjs-loader {
      height: 100%; width: 100%;
      position: fixed; top: 0; left: 0;
      background: black;
      z-index: 9999; display: flex;
      justify-content: center; align-items: center;
    }
    .arjs-loader div {
      color: white; font-family: sans-serif;
      font-size: 1.2em; text-align: center;
    }
  </style>
</head>


<body style="margin: 0; overflow: hidden;">

  <div class="arjs-loader">
    <div>Loading AR experience...</div>
  </div>

  <canvas id="outputCanvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 5;"></canvas>

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="logarithmicDepthBuffer: true; preserveDrawingBuffer: true; alpha: true;"
    canvas-compositor
  >
    <!-- Marker: default "Hiro" pattern marker -->
    <a-marker type="pattern" url="pattern-23.patt">
  <a-entity
    id="model-on-marker"
    gltf-model="bodys_test.glb"
    position="0 0 0"
    scale="0.1 0.1 0.1"
    rotation="0 0 0"
  ></a-entity>
</a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Hide loader once the scene is ready
    document.querySelector('a-scene').addEventListener('loaded', function () {
      document.querySelector('.arjs-loader').style.display = 'none';
    });

    // Auto-fit the model to a sane on-marker size and ground it at y=0, based
    // on its actual measured bounding box, rather than a hand-guessed scale
    // value. Also fixes two common "loaded but invisible" causes: exporters
    // sometimes leave frustumCulled bounding spheres wrong (mesh gets culled
    // as if off-screen), and single-sided materials can disappear depending
    // on viewing angle.
    (function () {
      const el = document.getElementById('model-on-marker');
      const targetHeight = 2; // desired height in AR.js world units; tweak to taste

      el.addEventListener('model-loaded', function (e) {
        const obj = e.detail.model;
        const box = new THREE.Box3().setFromObject(obj);
        const size = new THREE.Vector3();
        box.getSize(size);

        if (size.y > 0) {
          const fitScale = targetHeight / size.y;
          const s = el.object3D.scale;
          el.object3D.scale.set(s.x * fitScale, s.y * fitScale, s.z * fitScale);
          el.object3D.updateMatrixWorld(true);

          const refit = new THREE.Box3().setFromObject(obj);
          el.object3D.position.y -= refit.min.y; // ground it at y = 0
        }

        obj.traverse(function (node) {
          if (node.isMesh) {
            node.frustumCulled = false;
            if (node.material) node.material.side = THREE.DoubleSide;
          }
        });
      });

      el.addEventListener('model-error', function (e) {
        console.error('model-error:', e.detail && e.detail.src, e.detail && e.detail.format);
      });
    })();

    // Composite video + WebGL scene onto our own canvas. Called from the
    // canvas-compositor component's tock() - i.e. right after A-Frame's own
    // renderer.render() for this frame, not on a separately-timed loop.
    const outputCanvas = document.getElementById('outputCanvas');

    window.compositeFrame = function (sceneEl, outCanvas, ctx) {
      try {
        const video = document.querySelector('video');       // AR.js camera feed
        const glCanvas = sceneEl.canvas;                      // A-Frame's WebGL canvas

        const videoReady = video && video.readyState >= 2;
        const glReady = glCanvas && glCanvas.width > 0 && glCanvas.height > 0;

        if (videoReady && glReady) {
          if (outCanvas.width !== glCanvas.width || outCanvas.height !== glCanvas.height) {
            outCanvas.width = glCanvas.width;
            outCanvas.height = glCanvas.height;
          }

          // 1. Camera feed (bottom layer)
          ctx.drawImage(video, 0, 0, outCanvas.width, outCanvas.height);

          // 2. 3D model on top (transparent bg lets video show through)
          ctx.drawImage(glCanvas, 0, 0, outCanvas.width, outCanvas.height);

          // 3. Effects
          glitchEffect(ctx, outCanvas, 0.45); // 3rd param = intensity, 0 to 1
        }
      } catch (err) {
        console.error('compositeFrame error:', err);
      }
    };
  </script>

</body>
</html>
